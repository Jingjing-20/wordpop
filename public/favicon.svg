<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="balloonGrad" cx="35%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FF758F"/>
      <stop offset="40%" stop-color="#FF0054"/>
      <stop offset="85%" stop-color="#C9184A"/>
      <stop offset="100%" stop-color="#800F2F"/>
    </radialGradient>
    <filter id="popShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="1.5" dy="3" stdDeviation="2" flood-color="#590D22" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- String -->
  <path d="M 32 50 Q 35 56 30 59 Q 27 62 31 64" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Balloon Knot -->
  <polygon points="27,51 37,51 32,45" fill="#A70038"/>

  <!-- Balloon Body -->
  <g filter="url(#popShadow)">
    <path d="M 32 5 C 17 5 11 17 11 30 C 11 43 21 48 32 48 C 43 48 53 43 53 30 C 53 17 47 5 32 5 Z" fill="url(#balloonGrad)"/>
    
    <!-- Glossy Highlight / Reflection -->
    <path d="M 21 12 C 26 9 32 9 35 11 C 33 14 27 15 22 17 C 20 15 20 13 21 12 Z" fill="#FFFFFF" opacity="0.85"/>
    <ellipse cx="19" cy="22" rx="2.5" ry="5.5" transform="rotate(-22 19 22)" fill="#FFFFFF" opacity="0.65"/>
  </g>

  <!-- Pop Star Sparkles -->
  <g fill="#FBBF24">
    <!-- Big star top right -->
    <polygon points="52,13 54,18 59,19 55,22 56,27 51,24 47,27 48,22 44,19 49,18"/>
    <!-- Small star sparkle -->
    <circle cx="9" cy="14" r="2.5"/>
    <circle cx="56" cy="36" r="2"/>
  </g>
</svg>
